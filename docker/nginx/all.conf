# Full service image: main on :80, sub-apps on preview ports (matches prodUrl in main config).
server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    root   /usr/share/nginx/html/main;
    index  index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}

