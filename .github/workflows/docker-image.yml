name: Docker Image Build and Push

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: all
            dockerfile: docker/Dockerfile.all
            build_args: ""
          - app: main
            dockerfile: docker/Dockerfile
            build_args: APP_NAME=main
          - app: goddess
            dockerfile: docker/Dockerfile
            build_args: APP_NAME=goddess
          - app: rabbit
            dockerfile: docker/Dockerfile
            build_args: APP_NAME=rabbit
          - app: marksman
            dockerfile: docker/Dockerfile
            build_args: APP_NAME=marksman
          - app: jade_tree
            dockerfile: docker/Dockerfile
            build_args: APP_NAME=jade_tree
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify tag points to main or master
        run: |
          git fetch origin main master 2>/dev/null || git fetch origin main
          if git merge-base --is-ancestor "${GITHUB_SHA}" origin/main; then
            echo "Tag ${GITHUB_REF_NAME} points to a commit on main."
          elif git show-ref --verify --quiet refs/remotes/origin/master && git merge-base --is-ancestor "${GITHUB_SHA}" origin/master; then
            echo "Tag ${GITHUB_REF_NAME} points to a commit on master."
          else
            echo "Tag ${GITHUB_REF_NAME} must point to a commit on main or master."
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}/${{ matrix.app }}:${{ github.ref_name }}
          build-args: |
            VERSION=${{ github.ref_name }}
            BUILD_TIME=${{ github.event.head_commit.timestamp }}
            REPO=https://github.com/${{ github.repository }}
            ${{ matrix.build_args }}
          cache-from: type=gha,scope=${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app }}
